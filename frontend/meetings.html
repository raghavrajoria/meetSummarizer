<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>meetReaderCB — Meetings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <a class="brand" href="dashboard.html">meetReaderCB</a>
    <nav aria-label="Main">
      <a class="nav-link" href="dashboard.html">Overview</a>
      <a class="nav-link" href="meetings.html" aria-current="page">Meetings</a>
    </nav>
    <div class="sidebar-foot">
      <hr class="rule">
      <div class="profile">
        <span class="avatar" aria-hidden="true">A</span>
        <div class="profile-id">
          <strong>Admin</strong>
          <span>Account</span>
        </div>
        <button class="logout" type="button" id="logout" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <path d="M6.5 13.5h-3a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3"/>
            <path d="m10.5 10.5 3-2.5-3-2.5"/><path d="M13.5 8H6"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="content">

    <header class="topbar">
      <div class="top-actions">
        <button class="icon-button" type="button" aria-label="Search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="page-head">
      <h1>Meetings</h1>
      <div class="sub">
        <b id="countLabel">—</b>
        <span>Select a meeting to open its recording</span>
      </div>
    </div>

    <section class="section">
      <div class="section-head">
        <div>
          <p class="eyebrow">Library</p>
          <h2 class="h2">All recordings</h2>
        </div>
        <div class="filter-bar">
          <label for="dateFilter">Date</label>
          <input class="date-input" type="date" id="dateFilter">
          <button class="button" type="button" id="clearDate">All dates</button>
        </div>
      </div>

      <div class="m-list" id="meetingList" data-mode="meetings"></div>
      <p class="empty-state" id="listEmpty" hidden>No meetings on this date.</p>
    </section>

  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
