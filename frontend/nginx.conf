server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 513m;
  access_log off;
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location / { try_files $uri $uri/ =404; }
}
