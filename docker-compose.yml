name: indicmeet
x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &environment
    DEMO: ${DEMO:-false}
    APP_ENV: ${APP_ENV:-production}
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL or select .env.demo.example}
    INDICMEET_DATA_DIR: /var/lib/indicmeet
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
    S3_BUCKET: ${S3_BUCKET:-indicmeet}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY or select .env.demo.example}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY or select .env.demo.example}
    REDIS_URL: ${REDIS_URL:-redis://queue:6379/0}
    ASR_MODE: ${ASR_MODE:-remote}
    ASR_SERVICE_URL: ${ASR_SERVICE_URL:-}
    ASR_SERVICE_TOKEN: ${ASR_SERVICE_TOKEN:-}
    ASR_POLL_INTERVAL_SECONDS: ${ASR_POLL_INTERVAL_SECONDS:-2}
    ASR_JOB_TIMEOUT_SECONDS: ${ASR_JOB_TIMEOUT_SECONDS:-10800}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    AUTH_USERS_JSON: ${AUTH_USERS_JSON:-}
    MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
    STRICT_REVIEW: ${STRICT_REVIEW:-true}
  depends_on:
    db: {condition: service_healthy}
    queue: {condition: service_healthy}
    storage-init: {condition: service_completed_successfully}
services:
  db:
    image: postgres:16.6-bookworm
    restart: unless-stopped
    environment: {POSTGRES_USER: indicmeet, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD or select .env.demo.example}", POSTGRES_DB: indicmeet}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U indicmeet -d indicmeet"], interval: 3s, timeout: 3s, retries: 30}
  queue:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes: [queue-data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 30}
  minio:
    build: deploy/minio
    restart: unless-stopped
    environment: {MINIO_ROOT_USER: "${S3_ACCESS_KEY:?Set S3_ACCESS_KEY or select .env.demo.example}", MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?Set S3_SECRET_KEY or select .env.demo.example}"}
    command: server /data --console-address :9001
    volumes: [storage-data:/data]
    healthcheck: {test: [CMD, curl, -f, http://localhost:9000/minio/health/live], interval: 3s, timeout: 3s, retries: 30}
  storage-init:
    build: .
    environment: *environment
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: [python, -m, backend.init_storage]
  api:
    <<: *app
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: [api-staging:/var/lib/indicmeet]
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3)"], interval: 5s, timeout: 4s, retries: 30}
  worker:
    <<: *app
    environment: {<<: *environment, SERVICE_ROLE: worker}
    ports: ["127.0.0.1:${WORKER_PORT:-8081}:8081"]
    volumes: [worker-staging:/var/lib/indicmeet]
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz',timeout=3)"], interval: 5s, timeout: 4s, retries: 30}
  frontend:
    build: frontend
    restart: unless-stopped
    depends_on: {api: {condition: service_healthy}}
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:80"]
    healthcheck: {test: [CMD, wget, -q, --spider, http://127.0.0.1/], interval: 5s, timeout: 3s, retries: 30}
volumes:
  db-data:
  queue-data:
  storage-data:
  api-staging:
  worker-staging:
